<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Reading Room</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #2d2d2d;
      color: #d6d2cd;
      padding: 2.5rem 1.5rem;
      max-width: 820px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 0.15rem;
    }
    .subtitle {
      color: #9e9a94;
      font-size: 0.92rem;
      font-family: system-ui, -apple-system, sans-serif;
      margin-bottom: 1.75rem;
    }

    .card {
      background: #3a3a3a;
      border: 1px solid #4a4a4a;
      border-radius: 8px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1rem;
    }

    .form-row { margin-bottom: 1.2rem; }
    .form-row:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9e9a94;
      font-family: system-ui, -apple-system, sans-serif;
    }
    textarea, input, select {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #4e4e4e;
      border-radius: 5px;
      font: inherit;
      font-size: 0.93rem;
      background: #4a4a4a;
      color: #d6d2cd;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: #888;
      box-shadow: 0 0 0 2px rgba(136, 136, 136, 0.15);
    }
    textarea { resize: vertical; min-height: 56px; font-family: system-ui, -apple-system, sans-serif; }

    .count-select {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .count-select select {
      width: auto;
      padding: 0.4rem 0.6rem;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 0.75rem;
    }
    .cat-group h4 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9e9a94;
      margin-bottom: 0.3rem;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .cat-checkbox {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0;
      font-size: 0.88rem;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .cat-checkbox input[type="checkbox"] {
      width: auto;
      accent-color: #888;
    }
    .cat-checkbox label {
      margin: 0;
      font-weight: 400;
      cursor: pointer;
    }

    .other-input {
      margin-top: 0.4rem;
      font-size: 0.85rem;
      font-family: system-ui, -apple-system, sans-serif;
    }

    button {
      background: #5a5a5a;
      color: #e8e5e0;
      border: none;
      border-radius: 5px;
      padding: 0.7rem 1.5rem;
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      font-family: system-ui, -apple-system, sans-serif;
    }
    button:hover { background: #6a6a6a; }
    button:active { background: #4a4a4a; }

    .results { margin-top: 1.5rem; }
    .results.hidden { display: none; }

    .rec {
      background: #3a3a3a;
      border: 1px solid #4a4a4a;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 0.75rem;
      display: flex;
      gap: 1rem;
    }
    .rec .info { flex: 1; }
    .rec .title {
      font-weight: 600;
      font-size: 1.05rem;
      line-height: 1.35;
    }
    .rec .meta {
      color: #9e9a94;
      font-size: 0.83rem;
      margin-top: 0.1rem;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .rec .synopsis {
      margin-top: 0.45rem;
      font-size: 0.88rem;
      line-height: 1.55;
      color: #c5c1bc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .rec .reason {
      margin-top: 0.4rem;
      font-size: 0.85rem;
      color: #9e9a94;
      line-height: 1.5;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .rec .badge {
      display: inline-block;
      background: #444;
      color: #9e9a94;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      margin-top: 0.5rem;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .rating {
      display: inline-block;
      font-size: 0.8rem;
      color: #9e9a94;
      margin-top: 0.25rem;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .cover {
      width: 56px;
      height: 84px;
      object-fit: cover;
      border-radius: 3px;
      flex-shrink: 0;
      background: #4a4a4a;
    }
    .cover-placeholder {
      width: 56px;
      height: 84px;
      border-radius: 3px;
      flex-shrink: 0;
      background: #4a4a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 0.65rem;
      text-align: center;
      padding: 0.2rem;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <h1>The Reading Room</h1>
  <p class="subtitle">Tell me what you're looking for, and I'll suggest the best books for you.</p>

  <div class="card">
    <div class="form-row">
      <label class="form-label" for="readingIntent">What are you hoping to get from your next book?</label>
      <textarea id="readingIntent" placeholder="e.g. intellectual stimulation, escape reality, learn a new hobby, self improvement..." rows="2"></textarea>
    </div>

    <div class="form-row">
      <label class="form-label">Genres</label>
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <div class="form-row">
      <label class="form-label" for="countSelect">Number of recommendations</label>
      <div class="count-select">
        <select id="countSelect">
          <option value="5" selected>5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>
    </div>

    <button id="submitBtn">Get Recommendations</button>
  </div>

  <div class="results hidden" id="results">
    <div id="recsList"></div>
  </div>

  <script>
    const FICTION_CATS = [
      "Science Fiction",
      "Romance",
      "Mystery & Thriller",
      "Literature",
      "Historical Fiction",
      "Fantasy",
    ];
    const NONFICTION_CATS = [
      "Biographies & Memoirs",
      "Business",
      "Self-Help",
      "History",
      "Health & Wellness",
      "Science & Technology",
    ];

    function populateCategories() {
      const grid = document.getElementById('catGrid');
      const cats = [
        { label: 'Non-Fiction', cats: NONFICTION_CATS, otherId: 'otherNonfiction' },
        { label: 'Fiction', cats: FICTION_CATS, otherId: 'otherFiction' },
      ];
      grid.innerHTML = cats.map(group => `
        <div class="cat-group">
          <h4>${group.label}</h4>
          ${group.cats.map(cat => `
            <div class="cat-checkbox">
              <input type="checkbox" id="cat-${cat.replace(/\s+/g, '-').toLowerCase()}" value="${cat}">
              <label for="cat-${cat.replace(/\s+/g, '-').toLowerCase()}">${cat}</label>
            </div>
          `).join('')}
          <input type="text" id="${group.otherId}" class="other-input" placeholder="Other genre...">
        </div>
      `).join('');
    }
    populateCategories();

    function resetForm() {
      document.getElementById('readingIntent').value = '';
      document.getElementById('countSelect').value = '5';
      document.querySelectorAll('#catGrid input[type="checkbox"]').forEach(cb => cb.checked = false);
      document.getElementById('otherFiction').value = '';
      document.getElementById('otherNonfiction').value = '';
      document.getElementById('results').classList.add('hidden');
    }
    resetForm();

    async function getRecommendations() {
      const selectedCats = [...document.querySelectorAll('#catGrid input[type="checkbox"]:checked')].map(cb => cb.value);
      const intentText = document.getElementById('readingIntent').value.trim();
      const resultCount = parseInt(document.getElementById('countSelect').value, 10);
      const otherFiction = document.getElementById('otherFiction').value.trim();
      const otherNonfiction = document.getElementById('otherNonfiction').value.trim();

      const otherGenreText = [otherFiction, otherNonfiction].filter(Boolean).join(', ');

      if (!intentText && selectedCats.length === 0 && !otherGenreText) {
        alert('Please describe what you\'re looking for or select some genres.');
        return;
      }

      let queryParts = [];
      if (intentText) queryParts.push(intentText);
      if (selectedCats.length) queryParts.push(selectedCats.join(' '));
      if (otherGenreText) queryParts.push(otherGenreText);
      const query = queryParts.join(' ').trim() || 'books';

      const resultsEl = document.getElementById('results');
      const listEl = document.getElementById('recsList');

      resultsEl.classList.remove('hidden');
      listEl.innerHTML = '<div style="color:#9e9a94;padding:1rem;text-align:center;">Searching Open Library...</div>';

      try {
        const searchResp = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=${resultCount * 2}&mode=everything`);
        const searchData = await searchResp.json();
        const docs = searchData.docs || [];

        if (docs.length === 0) {
          listEl.innerHTML = '<div style="color:#9e9a94;padding:1rem;text-align:center;">No results found. Try different keywords.</div>';
          return;
        }

        const topDocs = docs.slice(0, resultCount);

        listEl.innerHTML = '<div style="color:#9e9a94;padding:1rem;text-align:center;">Fetching book details...</div>';

        const enriched = await enrichFromOpenLibrary(topDocs);

        listEl.innerHTML = enriched.map(item => {
          const title = item.title || 'Unknown';
          const author = item.author || 'Unknown';
          const year = item.year || '';
          const desc = item.synopsis || 'No description available.';
          const genres = item.genres;
          const rating = item.rating;
          const coverUrl = item.coverId ? `https://covers.openlibrary.org/b/id/${item.coverId}-M.jpg` : null;

          const coverHtml = coverUrl
            ? `<img src="${coverUrl}" alt="" class="cover">`
            : `<div class="cover-placeholder">No<br>Cover</div>`;

          return `
            <div class="rec">
              ${coverHtml}
              <div class="info">
                <div class="title">${escHtml(title)}${year ? ` <span style="font-weight:400;color:#9e9a94;">(${year})</span>` : ''}</div>
                <div class="meta">${escHtml(author)}${genres ? ` &middot; ${escHtml(genres)}` : ''}</div>
                ${rating ? `<div class="rating">&starf; ${rating}/5</div>` : ''}
                <div class="synopsis">${escHtml(desc)}</div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        listEl.innerHTML = `<div style="color:#9e9a94;padding:1rem;text-align:center;">Error: ${escHtml(err.message)}</div>`;
      }
    }

    async function enrichFromOpenLibrary(docs) {
      const results = [];
      for (const doc of docs) {
        try {
          const year = doc.first_publish_year || '';
          const subjects = doc.subject || [];
          const genres = subjects.slice(0, 3).join(', ');
          const coverId = doc.cover_i || null;
          const author = (doc.author_name || []).join(', ');

          let desc = '';
          let rating = null;
          try {
            const [wkResp, rateResp] = await Promise.all([
              fetch(`https://openlibrary.org${doc.key}.json`),
              fetch(`https://openlibrary.org${doc.key}/ratings.json`),
            ]);
            const wk = await wkResp.json();
            const d = wk.description;
            desc = typeof d === 'string' ? d : (d?.value || '');
            try {
              const rateData = await rateResp.json();
              rating = rateData.summary?.average ? rateData.summary.average.toFixed(1) : null;
            } catch { rating = null; }
          } catch { }

          results.push({
            title: doc.title || '',
            author,
            year,
            synopsis: desc || subjects.slice(0, 4).join(', ') || '',
            genres,
            rating,
            coverId,
          });
        } catch {
          results.push({
            title: doc.title || '',
            author: (doc.author_name || []).join(', ') || '',
            year: '',
            synopsis: '',
            genres: '',
            rating: null,
            coverId: null,
          });
        }
      }
      return results;
    }

    function escHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    document.getElementById('submitBtn').addEventListener('click', getRecommendations);
    document.getElementById('readingIntent').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.shiftKey === false) {
        e.preventDefault();
        getRecommendations();
      }
    });
  </script>
</body>
</html>
